services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: runbookqa
      POSTGRES_USER: runbookqa
      POSTGRES_PASSWORD: local-demo-only
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U runbookqa"]
      interval: 5s
      timeout: 5s
      retries: 30
  ollama:
    image: ollama/ollama:0.6.8
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    volumes: ["ollama-data:/root/.ollama"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://runbookqa:local-demo-only@db/runbookqa
      OLLAMA_URL: http://ollama:11434
      HF_HOME: /models
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - ./corpus:/corpus:ro
      - ./reports:/reports
      - ./config:/config:ro
      - ./evaluation:/evaluation:ro
      - hf-data:/models
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_started}
  web:
    build: ./frontend
    ports: ["127.0.0.1:5174:5174"]
    depends_on: [api]
volumes:
  db-data:
  ollama-data:
  hf-data:
